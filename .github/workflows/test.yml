name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax checks
        run: |
          php --version
          plugin=source/nut-dw/usr/local/emhttp/plugins/nut-dw
          # Unraid enables short open tags; .page files are PHP after their header
          for f in $(find source tests -name '*.php' -o -name '*.page') "$plugin/scripts/managed_config"; do
            php -d short_open_tag=1 -l "$f" >/dev/null
          done
          for f in source/nut-dw/etc/rc.d/* source/nut-dw/install/doinst.sh source/nut-dw/usr/sbin/* "$plugin"/scripts/*; do
            if head -n1 "$f" | grep -q bash; then bash -n "$f"; fi
          done

      - name: Tests
        run: |
          for t in tests/*.php; do
            php -d short_open_tag=1 "$t"
          done
