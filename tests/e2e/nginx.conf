# nginx configuration for the page tests, filled in by harness.py and run chrooted in the Unraid root.
# Routing follows the locations Unraid's /etc/rc.d/rc.nginx (webgui) generates, minus login and emhttpd.
user root;
@MODULES@
worker_processes 1;
error_log /var/log/nginx-e2e/error.log info;
pid /var/run/nginx-e2e.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    types {
        text/html html htm;
        text/css css;
        text/plain txt;
        application/javascript js;
        application/json json map;
        image/png png;
        image/gif gif;
        image/jpeg jpg jpeg;
        image/svg+xml svg svgz;
        image/x-icon ico;
        image/webp webp;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        application/vnd.ms-fontobject eot;
    }
    access_log /var/log/nginx-e2e/access.log;
    client_max_body_size 0;
    client_body_temp_path /var/tmp/nginx-e2e/body;
    fastcgi_temp_path /var/tmp/nginx-e2e/fastcgi;
    proxy_temp_path /var/tmp/nginx-e2e/proxy;
    uwsgi_temp_path /var/tmp/nginx-e2e/uwsgi;
    scgi_temp_path /var/tmp/nginx-e2e/scgi;

    # @NCHAN_SERVER@
    # nchan publishers (the webGUI's nchan scripts)
    server {
        listen unix:/var/run/nginx.socket default_server;
        location ~ /pub/(.*)$ {
            nchan_publisher;
            nchan_channel_id "$1";
            nchan_message_buffer_length $arg_buffer_length;
            nchan_message_timeout 0;
        }
    }
    # @END@

    server {
        listen 127.0.0.1:@PORT@;
        root /usr/local/emhttp;

        location = / {
            return 302 /Settings/NUTsettings;
        }
        location ~ /\. {
            return 404;
        }
        # page files handled by template.php
        location ~ ^/[A-Z].* {
            try_files $uri /webGui/template.php$is_args$args;
        }
        # @NCHAN_LOCATION@
        location ~ ^/sub/(.*)$ {
            nchan_subscriber;
            nchan_subscriber_timeout 0;
            nchan_channel_id "$1";
            nchan_channel_id_split_delimiter ",";
        }
        # @END@
        # what Unraid answers while its API (unraid-api) is not running
        location /graphql {
            default_type application/json;
            return 200 '{"errors":[{"error":{"name":"InternalError","message":"Graphql is offline."}}]}';
        }
        location ~ ^(.+\.php)(.*)$ {
            fastcgi_split_path_info ^(.+\.php)(.*)$;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            include /etc/nginx/fastcgi_params;
            @FASTCGI_EXTRA@
        }
    }
}
