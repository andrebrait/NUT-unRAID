# Generated by the NUT plugin from its settings. Do not edit: changes are overwritten.
# Add your own directives in the custom directive fields on the NUT Settings page.
MONITOR ups@127.0.0.1 1 monuser "monpass" master
SHUTDOWNCMD "/sbin/poweroff"
POWERDOWNFLAG "/etc/nut/killpower"
NOTIFYCMD "/usr/sbin/nut-notify"
NOCOMMWARNTIME 300
HOSTSYNC 15
RBWARNTIME 43200
NOTIFYFLAG FSD SYSLOG+EXEC
NOTIFYFLAG COMMBAD SYSLOG+EXEC
NOTIFYFLAG COMMOK SYSLOG+EXEC
NOTIFYFLAG NOCOMM SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC
NOTIFYFLAG ONBATT SYSLOG+EXEC
NOTIFYFLAG ONLINE SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC
DEBUG_MIN 3
# Custom directives
NOTIFYFLAG LOWBATT SYSLOG+EXEC
FINALDELAY 10
